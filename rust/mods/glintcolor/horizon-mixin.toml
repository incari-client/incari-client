# Incari's Enchant Glint (features/glintcolor) for the Rust build (ADR 0068, 0069). Hooks by name
# where Horizon has stamped the hook point (native-hooks.json), by function where it's still
# pending. Its settings are the client's (rust/mods/incari), shown in the module menu.
[mod]
id = "incari_glintcolor"
version = "0.1.0"
priority = 100

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "incari_glintcolor"
source = "runtime.rs"

[[injection]]
id = "color"
# Horizon's glint_color hook point is still a pending fragment
# (tools/native-hook-fragments/incari_client_hooks.json), so this targets its function. Make it
# `hook = "glint_color"` and `hook_version = 1` once Horizon stamps it.
target = "horizon_client::game::native_hooks::Game<'_>::native_glint_color"
kind = "HEAD"
helper = "color.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "tint", ty = "&mut [f32; 3]", value = "&mut *tint" },
]
