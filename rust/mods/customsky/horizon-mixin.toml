# Incari's Custom Sky (features/customsky) for the Rust build (ADR 0067, 0068, 0069). Hooks by name
# where Horizon has stamped the hook point (native-hooks.json), by function where it's still
# pending. Its setting is the client's (rust/mods/incari): the module menu shows it.
[mod]
id = "incari_customsky"
version = "0.1.0"
priority = 100

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "incari_customsky"
source = "runtime.rs"

[[injection]]
id = "frame"
hook = "frame"
hook_version = 1
kind = "HEAD"
helper = "frame.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "reloaded"
hook = "client_resources_reloaded"
hook_version = 1
kind = "HEAD"
helper = "reloaded.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "sky_layers"
# Horizon's sky_layers hook point is still a pending fragment
# (tools/native-hook-fragments/incari_shell_hooks.json), so this targets its function. Make it
# `hook = "sky_layers"` and `hook_version = 1` once Horizon stamps it.
target = "horizon_client::game::native_hooks::Game<'_>::native_sky_layers"
kind = "HEAD"
helper = "sky.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "day_time", ty = "i64", value = "day_time" },
  { name = "rain", ty = "f32", value = "rain" },
  { name = "thunder", ty = "f32", value = "thunder" },
  { name = "sun_angle", ty = "f32", value = "sun_angle" },
  { name = "layers", ty = "&mut Vec<crate::game::native_hooks::NativeSkyLayer>", value = "&mut *layers" },
]
