# Incari's Weather Changer (features/weatherchanger) for the Rust build (ADR 0068, 0069). Hooks by name where Horizon
# has stamped the hook point (native-hooks.json), by function where it's still pending. Its
# settings are the client's (rust/mods/incari): the module menu shows them.
[mod]
id = "incari_weatherchanger"
version = "0.1.0"
priority = 100

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "incari_weatherchanger"
source = "runtime.rs"

[[injection]]
id = "weather"
# Horizon's seen_weather hook point is still a pending fragment
# (tools/native-hook-fragments/incari_client_hooks.json), so this targets its function. Make it
# `hook = "seen_weather"` and `hook_version = 1` once Horizon stamps it.
target = "horizon_client::game::native_hooks::Game<'_>::native_seen_weather"
kind = "HEAD"
helper = "weather.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "rain", ty = "&mut f32", value = "&mut *rain" },
  { name = "thunder", ty = "&mut f32", value = "&mut *thunder" },
]

[[injection]]
id = "time"
# Horizon's seen_day_time hook point is still a pending fragment
# (tools/native-hook-fragments/incari_client_hooks.json), so this targets its function. Make it
# `hook = "seen_day_time"` and `hook_version = 1` once Horizon stamps it.
target = "horizon_client::game::native_hooks::Game<'_>::native_seen_day_time"
kind = "HEAD"
helper = "time.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "day_time", ty = "&mut i64", value = "&mut *day_time" },
]
