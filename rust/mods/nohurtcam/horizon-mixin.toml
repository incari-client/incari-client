# Incari's No Hurt Cam (features/nohurtcam) for the Rust build (ADR 0068, 0069).
# Hooks by name where Horizon has stamped the hook point (native-hooks.json), by function where
# it's still pending. Its settings are the client's (rust/mods/incari): the module menu shows them.
[mod]
id = "incari_nohurtcam"
version = "0.1.0"
priority = 100

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "incari_nohurtcam"
source = "runtime.rs"

[[injection]]
id = "tilt"
# Horizon's hurt_tilt hook point is still a pending fragment
# (tools/native-hook-fragments/incari_client_hooks.json), so this targets its function. Make it
# `hook = "hurt_tilt"` and `hook_version = 1` once Horizon stamps it.
target = "horizon_client::game::native_hooks::Game<'_>::native_hurt_tilt"
kind = "HEAD"
helper = "tilt.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "strength", ty = "&mut f64", value = "&mut *strength" },
]
