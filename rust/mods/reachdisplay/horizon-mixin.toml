# Incari's Reach Display (features/reachdisplay) for the Rust build (ADR 0068, 0069). Hooks by
# name where Horizon has stamped the hook point (native-hooks.json), by function where it's still
# pending. Its settings and HUD element are the client's (rust/mods/incari): the module menu shows
# them and the HUD editor places it.
[mod]
id = "incari_reachdisplay"
version = "0.1.0"
priority = 100

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "incari_reachdisplay"
source = "runtime.rs"

[[injection]]
id = "reach"
# Horizon's attack_reach hook point is still a pending fragment
# (tools/native-hook-fragments/incari_client_hooks.json), so this targets its function. Make it
# `hook = "attack_reach"` and `hook_version = 1` once Horizon stamps it.
target = "horizon_client::game::native_hooks::Game<'_>::native_attack_reach"
kind = "HEAD"
helper = "reach.rs"
bindings = [
  { name = "distance", ty = "f64", value = "distance" },
]

[[injection]]
id = "frame"
hook = "frame"
hook_version = 1
kind = "HEAD"
helper = "frame.rs"
bindings = [
  { name = "elapsed", ty = "std::time::Duration", value = "elapsed" },
]

[[injection]]
id = "hud"
hook = "hud"
hook_version = 1
kind = "HEAD"
helper = "hud.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "corners", ty = "&mut horizon_client::extras_hud::Corners", value = "&mut *corners" },
]
