# Incari's Low Fire (features/lowfire) for the Rust build (ADR 0068, 0069).
# Hooks by name where Horizon has stamped the hook point (native-hooks.json), by function where
# it's still pending. Its settings are the client's (rust/mods/incari): the module menu shows them.
[mod]
id = "incari_lowfire"
version = "0.1.0"
priority = 100

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "incari_lowfire"
source = "runtime.rs"

[[injection]]
id = "fire"
# Horizon's fire_overlay hook point is still a pending fragment
# (tools/native-hook-fragments/incari_client_hooks.json), so this targets its function. Make it
# `hook = "fire_overlay"` and `hook_version = 1` once Horizon stamps it.
target = "horizon_client::game::native_hooks::Game<'_>::native_fire_overlay"
kind = "HEAD"
helper = "fire.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "lower", ty = "&mut f32", value = "&mut *lower" },
]
