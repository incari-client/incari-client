# Incari's Hit Color (features/hitcolor) for the Rust build (ADR 0068, 0069). Hooks by name where
# Horizon has stamped the hook point (native-hooks.json), by function where it's still pending. Its
# settings are the client's (rust/mods/incari), shown in the module menu.
[mod]
id = "incari_hitcolor"
version = "0.1.0"
priority = 100

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "incari_hitcolor"
source = "runtime.rs"

[[injection]]
id = "color"
# Horizon's hit_color hook point is still a pending fragment
# (tools/native-hook-fragments/incari_client_hooks.json), so this targets its function. Make it
# `hook = "hit_color"` and `hook_version = 1` once Horizon stamps it.
target = "horizon_client::game::native_hooks::Game<'_>::native_hit_color"
kind = "HEAD"
helper = "color.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "color", ty = "&mut [f32; 4]", value = "&mut *color" },
]
