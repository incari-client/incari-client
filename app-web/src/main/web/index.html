    html, body { margin: 0; height: 100%; background: #0c131b; color: #dde6ee; font: 14px system-ui, sans-serif; }
    #incari-canvas { display: block; width: 100vw; height: 100vh; outline: none; }
    #incari-loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 12px; background: linear-gradient(rgba(12, 19, 27, 0.2), rgba(12, 19, 27, 0.45)),
      var(--incari-backdrop) center 35% / cover no-repeat, #0c131b; }
    #incari-loader::before { content: ""; width: 96px; height: 96px; background: var(--incari-mark) center / contain no-repeat;
      filter: drop-shadow(0 0 18px rgba(169, 220, 255, 0.55)); }
    #incari-loader[hidden] { display: none; }
    #incari-loader h1 { margin: 0 0 12px; font-size: 22px; font-weight: 300; letter-spacing: 0.4em; padding-left: 0.4em; text-transform: uppercase;
      color: #fff; text-shadow: 0 1px 8px rgba(12, 19, 27, 0.5); }
    /* The bar as the mark's comet, like the game's loading screen (LoadingLook): an ice-blue trail with a bright head. */
    #incari-track { width: min(420px, 80vw); height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.18);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12); }
    #incari-bar { position: relative; width: 0; min-width: 4px; height: 100%; border-radius: 2px; background: #a9dcff;
      box-shadow: 0 0 8px rgba(169, 220, 255, 0.6); transition: width 120ms linear; }
    #incari-bar::after { content: ""; position: absolute; right: -6px; top: -4px; width: 12px; height: 12px; border-radius: 50%;
      background: radial-gradient(#fff 0 30%, rgba(169, 220, 255, 0.9) 45%, rgba(169, 220, 255, 0) 70%); }
    #incari-bar.indeterminate { animation: incari-pulse 1.2s ease-in-out infinite; }
    #incari-loader.failed #incari-bar { background: #e5534b; box-shadow: none; animation: none; }
    #incari-loader.failed #incari-bar::after { display: none; }
    #incari-status { font-size: 15px; color: #fff; text-shadow: 0 1px 6px rgba(12, 19, 27, 0.6); }
    #incari-detail { min-height: 1.4em; max-width: min(560px, 90vw); text-align: center; opacity: 0.8;
      text-shadow: 0 1px 6px rgba(12, 19, 27, 0.6); }
    #incari-track[hidden], #incari-choose[hidden], .incari-pick[hidden] { display: none; }
    #incari-choose { display: flex; flex-direction: column; gap: 10px; width: min(480px, calc(100vw - 32px)); }
    .incari-pick { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; text-align: left;
      font: inherit; color: #dde6ee; background: rgba(16, 24, 34, 0.72); border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 10px; cursor: pointer; }
    .incari-pick:hover:not(:disabled), .incari-pick:focus-visible { border-color: #a9dcff; outline: none; }
    .incari-pick:disabled { cursor: not-allowed; opacity: 0.55; }
    #incari-pick-fast { background: rgba(24, 40, 58, 0.78); border-color: rgba(169, 220, 255, 0.45); }
    .incari-pick-title { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; color: #fff; }
    .incari-badge { padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 600;
      color: #0b1a2a; background: #a9dcff; }
    .incari-badge.quiet { color: #dde6ee; background: rgba(255, 255, 255, 0.14); }
    .incari-pick-text { font-size: 13px; opacity: 0.8; }
    .incari-pick-why { font-size: 13px; color: #e5a04b; }
    .incari-pick-why:empty { display: none; }
    .incari-pick-hint { margin: 2px 0 0; font-size: 13px; opacity: 0.8; text-align: center;
      text-shadow: 0 1px 6px rgba(12, 19, 27, 0.6); }
    @keyframes incari-pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
  </style>
</head>
<body>
  <canvas id="incari-canvas"></canvas>
  <div id="incari-loader" role="status" aria-live="polite">
    <h1>Incari</h1>
    <div id="incari-track"><div id="incari-bar"></div></div>
    <div id="incari-status">Loading</div>
    <div id="incari-detail"></div>
    <!-- Where more than one build can run, the player picks one (boot.ts, ADR 0036);
         `?build=fast|compatible|rust` skips this. Fast is the JSPI build, Compatible the coroutine
         build, Rust the experimental Horizon build (ADR 0068), shown only when the copy has it. -->
    <div id="incari-choose" role="group" aria-labelledby="incari-status" hidden>
      <button id="incari-pick-fast" class="incari-pick" type="button" aria-describedby="incari-why-fast">
        <span class="incari-pick-title">Fast <span class="incari-badge">Recommended</span></span>
        <span class="incari-pick-text">Higher frame rates, a smaller download and faster loading. Needs a recent
          browser.</span>
        <span class="incari-pick-why" id="incari-why-fast"></span>
      </button>
      <button id="incari-pick-compatible" class="incari-pick" type="button" aria-describedby="incari-why-compatible">
        <span class="incari-pick-title">Compatible <span class="incari-badge quiet">For older browsers</span></span>
        <span class="incari-pick-text">Works in Safari and older versions of Chrome and Firefox, but runs slower.</span>
        <span class="incari-pick-why" id="incari-why-compatible"></span>
      </button>
      <button id="incari-pick-rust" class="incari-pick" type="button" aria-describedby="incari-why-rust" hidden>
        <span class="incari-pick-title">Rust <span class="incari-badge quiet">Experimental</span></span>
        <span class="incari-pick-text">The game rewritten in Rust, drawn with WebGPU. Few Incari modules yet, and
          some things may not work.</span>
        <span class="incari-pick-why" id="incari-why-rust"></span>
      </button>
      <p class="incari-pick-hint">Choose Compatible only if Fast won't start in your browser.</p>
    </div>
  </div>
  <noscript>The game needs JavaScript.</noscript>
  <!-- The loader (src/main/ts/boot.ts, types stripped by :app-web:pageScripts). Builds contain
       Mojang code: this page is for your own machine or your own server, never published. -->
  <script type="module" src="boot.js"></script>
</body>
</html>
