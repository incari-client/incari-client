# The ceiling for Incari's changes to vendor code, checked by tools/ci/check-patch-budget.sh.
# Raising a number is fine when the pull request says why; the point is that growth is noticed.
# Four more decompile fixes (a dropped loop exit, record constructors, float precision)
# and seven thin hooks that route the game's SDL, thread-pool, backend and network calls
# through the platform layer (ADR 0005). The glue classes themselves are replaced whole through
# classes.txt, which costs no vendor lines here.
# Then two more decompile fixes from comparing lambda bodies (LivingEntity, LerpFunction).
# Five hooks the browser build needs (ADR 0006), each a guard or a call into
# incari.client.platform: native library loading, the Vulkan availability check and feature
# tables, the frame's render step (off until the WebGL2 backend existed), and LWJGL's debug-allocation tracking.
# One hook, at three sites in FrontendGpuDevice, that lets the WebGL2 backend compile its
# own pipelines from the build's translated shaders, so the frontend never creates its shaderc
# compiler (ADR 0007). And one guard: a platform without Realms (the browser build strips it)
# answers Realms' availability check as offline developer mode does, instead of crashing the title
# screen on the stripped HTTP client.
# Two hooks for WebSocket server addresses (ADR 0009): ServerNameResolver skips DNS and SRV
# lookups for them, and Connection.connect opens them with message framing. ServerAddress, which
# learns to hold a ws:// URL, is replaced whole through classes.txt.
# One hook, at the two loading methods of SoundBufferLibrary, that lets a platform with its
# own decoder (the browser's) decode sounds and stream music itself (ADR 0013).
# The thread-pool hook also takes the platform's own executor, so the browser runs the
# game's background pool between frames instead of inline (four more lines in the same patch); and
# one hook in FramerateLimiter lets a platform that paces frames itself (the browser, by skipping
# animation frames) take the frame limit instead of the game sleeping inside the frame.
# The Connection.connect hook now takes every connection that needs Incari's pipeline
# (Eagler for a WebSocket, Via for another version); and seven one-line hooks (ADR 0016, ADR 0017):
# the connect screen works out the server's version before it connects; ServerData keeps the
# chosen version (a field and three calls); the server list pings Eagler servers with their MOTD
# query and counts versions Via reaches as compatible; the edit-server screen gets a Version
# button; PlayerInfo's skin lookup asks for Eagler skins; the skin customisation screen links the
# Eagler skin screen. Then the edit-server callback copies the chosen version onto the list entry
# (and onto a hidden entry that is added again), so an edit no longer resets it to Auto.
# "Auto" versions (ADR 0018): one hook in DisconnectedScreen.init hands a server's refusal to
# VersionRetry, which joins again with the version the refusal names.
# ADR 0019: the same DisconnectedScreen hook now also takes up an Eagler server's request for
# a password and its redirects (JoinFailures); Incari's key mappings join the game's list (push to
# talk); one per-tick call into Incari (voice chat, and ADR 0020's rules); the pause menu's voice chat
# button; the HUD's list of who is talking; the multiplayer screen's button to join a shared world.
# ADR 0020: 1.8's behaviour on 1.8 servers, each hook a call that does nothing elsewhere: no
# attack cooldown; the pick margin; sneaking's height; no swimming pose or state before 1.13; the
# slow-movement cut-off; swords that block (three methods of Item); the swing before the attack
# (two lines, one of them only a condition); and the shape getters of BlockStateBase (three
# methods), where 1.8's shapes for ladders, lily pads, panes, anvils and farmland come in.
# ADR 0021: two hooks for the profiler, three lines each: the game loop's frame profiler
# also feeds Incari's (Minecraft.run), and Gui draws the profiler's overlay.
# ADR 0023: the section compiler's constructor tells Incari's mesher its models and
# settings; the compile and re-sort steps call it instead of the game's compiler and sorter; the
# section buffer packs start small (they only hold finished meshes); and the four terrain
# pipelines take their vertex format from Incari (compact in the browser).
# ADR 0024: the particle cap (the game's scheme, scaled to the tier); the particle quad, its
# rotation and its light (calls that allocate nothing); entity occlusion culling (one condition in
# LevelExtractor); ModelFeatureRenderer hands model submits to Incari's instanced batches (a field,
# four overrides that call through, and one call in prepareModel); and BufferBuilder transforms
# vertices without allocating (two overrides).
# ADR 0025, nine patches, each a call into Incari: the data fixer built only when needed (Main's
# start-up optimization and Minecraft's fixer, one line each); the atlas cap (the stitcher's largest
# size, the sprites it's given, the sprite each loader makes); the terrain's heaps and staging buffer
# by tier (three sizes in SectionRenderDispatcher); block states sharing their face arrays and sturdy
# tables, worked out once per shape (BlockBehaviour, and Blocks saying when it's done); world text laid
# out once (TextFeatureRenderer, and Minecraft clearing it on a font option); one layer array, not one
# per section (LevelRenderer); and BufferBuilder's putBakedQuad override.
# ADR 0026, three: the loading screen's fade; models after the title screen (the reload's
# creation, and the two places a world is joined); the build's decoded sprites (the sprite loader and
# the mip levels).
# ADR 0027, four, each a call into Incari: finished futures read without join (Util.sequence and
# FontManager, which made Function.apply a coroutine everywhere); a LightEngine
# accessor for the visible light array, so the mesher's snapshot reads a section's light whole; the
# radix sort (VertexSorting); the tint blend reusing the row's samples (ClientLevel's blend and the
# three places its tint caches are invalidated).
# Then two more: plain items drawn instanced (ItemFeatureRenderer, as ModelFeatureRenderer in ADR 0024);
# skins with all-or-nothing alpha in the solid phase (SubmitNodeCollection's phase choice, and the two
# places texture pixels are uploaded, DynamicTexture and ReloadableTexture).
# Credits: one hook, a button on the vanilla Credits & Attribution screen that opens Incari's credits
# and the licenses of what it adds (incari.client.credits).
# Edit Profile: three one-line hooks (incari.client.profile): Minecraft.getUser answers the name
# the player chose (and getGameProfile asks it), Edit Profile joins the screens shown once the game
# has loaded, and the title screen links it. The skin customisation screen's button now opens it.
# ADR 0030, three: each section mesh keeps its draws (a field and its constructor in
# CompiledSectionMesh, UberGpuBuffer saying when an allocation moves, and LevelRenderer's indirect
# draw list taken from Incari); only the block sprites something draws animate (an id and the three
# U-coordinate getters in TextureAtlasSprite, TextureAtlas's build, tick and clear, and a redraw on
# AnimationState); and the palettes' threading checks skipped where every thread is one
# (ThreadingDetector).
# Then two more: the HUD kept in a texture between refreshes (Gui's start and its early return,
# Hud's split after the crosshair's stratum, GuiRenderer drawing the strata above it into the
# texture and blending it back); closed chests meshed into terrain (the chests' sprites added to the
# blocks atlas in SpriteSourceList, and the two lid events, ChestBlockEntity's and EnderChestBlockEntity's).
# ADR 0031, three: ambient particles worked out once per biome a tick (ClientLevel's animateTick and
# doAnimateTick), a glyph's four vertices written in one call (BakedSheetGlyph's render, and on
# BufferBuilder a whole vertex written with its own helpers, and its format), and blank sign lines left out
# (AbstractSignRenderer's submitSignText). And the occlusion graph's full update paused at the
# background pool's slot ends (SectionOcclusionGraph's runUpdates, once a node), and particle light
# kept until a block or its light changes (LevelExtractor's setSectionDirty says when).
# ADR 0032, five: catch-up ticks paced (Minecraft's runTick, after the ticks due); the light maps
# brought up to date in place (LayerLightSectionStorage's swapSectionMap, and accessors on
# DataLayerStorageMap and the sky map's columns); a remote server's light arrays kept as they arrive
# (ClientPacketListener's readSectionList); the occlusion graph's copies refilled
# (SectionOcclusionGraph's scheduleFullUpdate); and particles drawn instanced
# (QuadParticleFeatureRenderer's prepareGroup, finishPrepare, drawLayers and finishExecute, and an
# accessor on QuadParticleRenderState).
# ADR 0033, one: packets their handlers only hand to the game's thread queued without the round
# trip (Connection's channelRead0, before the handler and where it catches the handoff).
# ADR 0034, five: a translucent order that holds from every camera never re-sorted
# (SectionRenderDispatcher's resortTransparency); air passed over in block collision sweeps
# (BlockCollisions' computeNext); a section task queued again without a throw when no buffer pack is
# free (SectionRenderDispatcher's runTask); kept tint biomes dropped only near a chunk that came or
# went (ClientLevel's unload and onChunkLoaded, the ADR 0027 hooks given the chunk); and accessors
# to read a section copy's blocks in bulk (RenderSectionRegion, SectionCopy).
# ADR 0038, two: Open to LAN fails as a port that won't open where the platform can't listen
# (ServerConnectionListener's startTcpServerListener), and worlds dropped on the world list imported
# (SelectWorldScreen's onFilesDrop, which it didn't override).
# ADR 0039, three: singleplayer's server in a worker (Minecraft's doWorldLoad hands the world over,
# its pause line and pauseGame let a worker world pause, and disconnect waits for it to save); the
# world's icon taken for a worker world (GameRenderer's tryTakeScreenshotIfNeeded); and World Options
# asking a SingleplayerHost instead of the IntegratedServer (its declared types and two lookups).
# ADR 0040, two: stronghold rings searched when a chunk needs them (ChunkGeneratorStructureState's
# generateRingPositions), and natural mob spawn settings looked up once per biome
# (NaturalSpawner's createState).
# ADR 0041, five: a chunk's surface read and written through an Incari writer (MaterialSystem's
# buildSurface: the writer made, its column's getBlock and setBlock), the surface rules' biome lookup
# without the blur's hashing where its cells agree (the same method's rule context), a level's and a
# chunk's build height read once (fields and getters in Level and ChunkAccess), each advancement
# trigger's criterion codec built once (Criterion's criterionCodec), and singleplayer's server worker
# started while the world list shows (Gui's setScreen).
# ADR 0042, three: a range choice's and a lerp's sides sampled only where used (RangeChoiceFunction's
# and LerpFunction's samplers, one call each, and SamplerContext's cache answering a branch's rows
# from, or caching them as, the whole volume); a chunk's terrain built in a helper worker when there
# is one (NoiseBasedChunkGenerator's buildTerrain and createNoiseChunk, and accessors on Beardifier
# for what it holds); and goals' control flags as masks (a field kept by Goal.setFlags, and
# GoalSelector's two flag checks and disabled flags).
# ADR 0043, four: saved chunks deflated through Incari's choice of level (RegionFileVersion's
# deflate stream); the surface rules' first positional draw taken without making the random (two
# seed accessors on XoroshiroPositionalRandomFactory, and the calls in VerticalGradientCondition and
# MaterialSystem's surface depth); and the surface rules' density buffers reused from chunk to
# chunk (MaterialRuleContext's prefill, and a call at the start of MaterialSystem's buildSurface);
# and the Unicode font's glyphs packed into arrays (UnihexProvider: a field, its two lookups, and
# the packing at the end of its loading).
# Before M4: four patches. A Potato graphics preset, the default (GraphicsPreset's constant and its
# case, Options' default); players' heads in the tab list on offline-mode servers (PlayerTabOverlay);
# no secure-chat toast or marks (ClientPacketListener, ChatListener); passwords drawn as stars in
# login commands and password dialogs (ChatScreen, InputControlHandlers).
# Then two in PauseScreen: voice chat's panel in the top right (with an Eagler server's icons over
# the buttons) in place of its button, and an Eagler server's own pause menu buttons. Then the
# player beside the title screen's buttons (TitleScreen's Edit Profile hook, changed), and no Server
# Links button beside an Eagler server's own (PauseScreen).
# Two hooks for the module framework (ADR 0046): KeyboardInput hands the movement keys to the
# modules after reading them, and Hud draws the modules' HUD elements before the chat.
# Then two for changing the game's screens without a patch each (ScreenEdits): Screen makes
# Incari's edits after each layout (opening, a rebuild, a resize) and keeps what they added, and
# Gui.setScreen may show a screen of Incari's in place of one of the game's. And three for a skin to
# redraw the GUI (Skins): AbstractWidget asks it before drawing a widget, GuiGraphicsExtractor before
# a named sprite, part of one or a texture, and Screen before its default backdrop.
# The look (ADR 0048): the Normal GUI preset's menu blur (GameRenderer); TrueType fonts drawn
# by the platform at the GUI scale (TrueTypeGlyphProviderDefinition's load, Minecraft.resizeGui);
# Incari's own resource pack in the pack repository (Minecraft); the title screen's layout and
# drawing handed to Incari (TitleScreen, two hooks); the HUD's text panels (the tab list's four
# fills, the scoreboard's two, a chat line's color, the chat field); containers' labels light where
# the look redraws them (AbstractContainerScreen, InventoryScreen).
# Then the HUD editor's backdrop kept between refreshes on Potato (BackdropCache): GameRenderer's
# extract skips the level between refreshes, its render doesn't age the pooled render targets on
# those frames (else each refresh made them again), and GuiRenderer's blur copies the kept backdrop.
# The first modules (ADR 0050): the fire overlay moved down by modules (ScreenEffectRenderer,
# Low Fire), and the scoreboard sidebar handed to a module's HUD element (Hud: the sidebar taken from
# its place, its drawing made public and moved to the element's place). Clear Chat and No Hurt Cam
# hold the game's own options and need no patch.
# Minimap and waypoints (ADR 0051): what modules draw every frame over the world, under the HUD
# (Hud, beside the crosshair: waypoints' labels, the minimap), and what they add to the world itself
# (LevelRenderer's submitted features: waypoints' beams).
# The HUD modules (ADR 0052): each mouse press over the world handed to modules (MouseHandler: CPS,
# Keystrokes), and an entity hit's reach (Minecraft.startAttack: Reach Display).
# The visual and combat modules (ADR 0053): the crosshair drawn by a module (Hud); the camera turned
# without the player (MouseHandler's turn, Camera's angles: Freelook); how held items are drawn in
# first person (FirstPersonHandsAndItemsRenderer: Low Shield, 1.7 Animations); the weather and time
# shown on the client (Level's rain and thunder getters, WeatherEffectRenderer's snow, the client day
# clock: Weather Changer). Cooldown Indicator holds the game's own option and needs none.
# The screen modules (ADR 0054): a saved screenshot handed to modules (Screenshot: Screenshot
# Manager's copy on F2); a container's contents as a tooltip grid (ItemStack's tooltip image, the
# tooltip component switch, ItemContainerContents' lines left out: Shulker Tooltips). The Theme
# Editor needs none: Theme's colors became the player's to set.
# The look's first performance pass: two accessors on GuiGraphicsExtractor, the clip and the GUI's
# render state, so Incari's own shapes go in as one render state each instead of a blit per piece.
# And GuiSkinRenderer keeps a skin's picture while the model holds still (SkinPictures).
# Incari chat (ADR 0059): the game's Friends key opens Incari's chat menu (Minecraft's
# toggleFriendsScreen, one call; Mojang's friends need a Microsoft account, which Incari never has).
# Cosmetics (ADR 0061), four: what a player wears drawn on them (a field on AvatarRenderState, and
# AvatarRenderer's layer and the call that puts it on the state), emotes posing the player model
# (PlayerModel's setupAnim, one call), Block Outline's color, width and fill (LevelRenderer's
# outline, two calls) and Hit Color's tint (OverlayTexture hands its texture over, one call).
# Fullbright: the lightmap's night vision strength through ModuleEffects (LightmapRenderStateExtractor,
# one call).
# Featured servers: copies an earlier build saved after each join left out as the list loads
# (ServerList.load, one call).
# Weather Changer: its weather moved off Level.getRainLevel/getThunderLevel (which Riptide and the
# rest of the game decide by) to where weather is drawn and heard: the weather renderer, the sky, the
# fog, the weather's environment attributes, and ClientLevel's rain splashes and sounds (one call
# each; Level's two hooks removed).
# A deleted world's waypoints and explored map deleted with it (LevelStorageAccess.deleteLevel, one
# call).
# Waypoint tags projected as the world is, with its bobbing, tilt and warp (GameRenderer.renderLevel,
# one call).
# 1.7 Animations undoes the held item's own display transform: the hand's render state hands it over
# (ItemStackRenderState, a one-line accessor; FirstPersonHandsAndItemsRenderer's hook gets it).
# A spear's stab fires the attack event as other attacks do (Minecraft.startAttack, one call).
# Login commands' passwords kept out of the chat's history and command_history.txt
# (ChatComponent.addRecentChat and CommandHistory's load, one call each).
# A module keybind waiting for a key gets F2, F11 and the game's other own keys (KeyboardHandler's
# global keys skipped as for the Controls screen, one call).
# The player's own saved servers marked as theirs (ServerList.save, one call), so one with a
# featured server's name and address is kept; the load hook reads the mark.
# The menus' photo instead of the panorama (Screen.extractPanorama, one call), so the connecting
# and loading screens show what the title and every other menu do.
# The loading screen in the client's look (LoadingOverlay: its three backdrop fills and its logo and
# bar, one call each to LoadingLook), so start-up and reloads show the photo, Incari's mark and bar.
# Incari's badge before Incari players' names in the tab list (PlayerTabOverlay, one call to
# Cosmetics.tabListName), as their name tags have it.
# Incari's brand reported to servers and the F3 screen (ClientBrandRetriever returns "incariclient").
# The minimap redraws a chunk only when the game marks it changed (LevelExtractor's setSectionDirty,
# one call beside the particle light's), instead of every few seconds whether it changed or not.
